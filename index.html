<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jester</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="court" aria-hidden="true"></canvas>
  <div id="rotate-prompt" role="alert">
    <div class="rotate-icon">📱</div>
    <div>Rotate your phone to landscape to play</div>
  </div>
  <div id="app">
    <div id="side">
    <header id="hud">
      <div class="hud-block">
        <span class="hud-label">Ante</span>
        <span id="ante-val" class="hud-val">1</span>
        <span id="venue-val" class="hud-sub"></span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Round</span>
        <span id="round-val" class="hud-val">1</span>
        <span id="audience-val" class="hud-sub"></span>
      </div>
      <div class="hud-block wide">
        <span class="hud-label">Score / Target</span>
        <span id="score-val" class="hud-val">0 / 300</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">$</span>
        <span id="money-val" class="hud-val">4</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Hands</span>
        <span id="hands-val" class="hud-val">4</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Discards</span>
        <span id="discards-val" class="hud-val">3</span>
      </div>
      <button id="mute-btn" aria-label="Mute sound" title="Mute sound">🔊</button>
    </header>
    <section id="preview" aria-label="Current hand preview">
      <span id="preview-name">&nbsp;</span>
    </section>
    <section id="amusement" data-mood="bored" aria-label="The King's amusement">
      <img id="amusement-art" alt="" hidden>
      <div class="amusement-body">
        <span id="amusement-label"></span>
        <div id="amusement-bar"><div id="amusement-fill"></div></div>
      </div>
    </section>
    <div id="side-tools"></div>
    </div>

    <section id="boss-banner" class="hidden" aria-live="polite">
      <img id="boss-art" alt="" hidden>
      <span class="boss-text">
        <span><span id="boss-name"></span> — <span id="boss-desc"></span></span>
        <span id="boss-quip"></span>
      </span>
    </section>

    <div id="top-row">
      <div id="jester-group" class="slot-group">
        <section id="jester-row" aria-label="Owned jesters"></section>
        <div id="jester-count" class="slot-count"></div>
      </div>
      <div id="trick-group" class="slot-group">
        <section id="trick-row" aria-label="Mask and decree cards"></section>
        <div id="trick-count" class="slot-count"></div>
      </div>
    </div>

    <div id="hand-area">
      <div id="deck-pile" role="button" tabindex="0" aria-label="View deck">
        <div class="deck-card"></div>
        <div class="deck-card"></div>
        <div class="deck-card"></div>
        <span id="deck-count"></span>
      </div>

      <section id="hand-row" aria-label="Your hand"></section>
    </div>

    <div id="controls">
      <button id="play-btn">Play Hand</button>
      <button id="sort-rank-btn" class="sort-btn">Sort by Rank</button>
      <button id="sort-suit-btn" class="sort-btn">Sort by Suit</button>
      <button id="discard-btn">Discard</button>
      <button id="deck-btn" class="sort-btn">Deck</button>
      <button id="shop-btn" class="sort-btn hidden">Shop</button>
      <button id="win-btn" class="sort-btn hidden">Win</button>
    </div>

    <details id="hand-reference">
      <summary>Hand Rankings</summary>
      <ol id="hand-reference-list"></ol>
    </details>

    <div id="deck-modal" class="hidden" role="dialog" aria-label="Deck contents">
      <div id="deck-card">
        <h2>Deck</h2>
        <div id="deck-legend"></div>
        <div id="deck-grid"></div>
        <button id="deck-close-btn">Close</button>
      </div>
    </div>

    <div id="inspect" class="hidden" role="tooltip"></div>

    <div id="overlay" class="hidden">
      <div id="overlay-card">
        <header id="overlay-bar">
          <div id="overlay-head">
            <h2 id="overlay-title"></h2>
            <p id="overlay-sub"></p>
          </div>
          <div id="shop-money" class="hidden" aria-label="Money">$<span id="shop-money-val"></span></div>
          <div id="overlay-actions">
            <button id="money-btn" class="hidden">+$1000</button>
            <button id="reroll-btn" class="hidden"></button>
            <button id="overlay-btn"></button>
          </div>
        </header>
        <div id="overlay-body">
          <div id="shop-stock">
            <section id="pack-section" class="hidden">
              <h3 id="pack-title">Mask Pack: pick one</h3>
              <div id="pack-items"></div>
              <button id="pack-skip-btn">Skip</button>
            </section>
            <section class="shelf" id="jesters-shelf">
              <h3>Jesters</h3>
              <div id="shop-items" class="shelf-row"></div>
            </section>
            <section class="shelf" id="prop-shelf">
              <h3>Prop</h3>
              <div id="shop-prop" class="shelf-row"></div>
            </section>
            <section class="shelf" id="tricks-shelf">
              <h3>Masks and decrees</h3>
              <div id="shop-tricks" class="shelf-row"></div>
            </section>
            <section class="shelf" id="packs-shelf">
              <h3>Packs</h3>
              <div id="shop-packs" class="shelf-row"></div>
            </section>
          </div>
          <aside id="shop-yours" aria-label="What you own">
            <p id="shop-yours-empty" class="hidden">Jesters and cards you buy show up here.</p>
            <section id="owned-jesters-section" class="hidden">
              <h3>Your jesters <span id="owned-jesters-count"></span></h3>
              <div id="owned-jesters"></div>
            </section>
            <section id="owned-tricks-section" class="hidden">
              <h3>Your cards <span id="owned-tricks-count"></span></h3>
              <div id="owned-tricks"></div>
            </section>
            <p id="owned-props"></p>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <script src="sounds.js"></script>
  <script src="court.js"></script>
  <script src="game.js"></script>
</body>
</html>
